services:
  postgres:
    image: postgres:16
    container_name: wuda-postgres
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - wuda_pgdata:/var/lib/postgresql/data

  django:
    build: .
    command: python -m uvicorn mysite.asgi:application --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    env_file: .env
    depends_on: 
      - postgres

volumes:
  wuda_pgdata:
